<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Surprise For You</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#241628; --bg-2:#2f1c35; --card:#362042; --gold:#e3a76f; --gold-soft:#f0c9a0;
    --cream:#f5ece1; --muted:#b8a2bc; --line:rgba(245,236,225,0.15); --good:#8fb98a; --bad:#c77373;
  }
  body.theme-sunset{ --bg:#2e1810; --bg-2:#3d2214; --card:#4a2c1c; --gold:#f0965a; --gold-soft:#f7bd8a; --cream:#fbe9d8; --muted:#c9a186; --line:rgba(251,233,216,0.15); }
  body.theme-ocean{ --bg:#0f2027; --bg-2:#16323d; --card:#1d4048; --gold:#5fc9c9; --gold-soft:#9be0e0; --cream:#e4f3f3; --muted:#8fb5b8; --line:rgba(228,243,243,0.15); }
  body.theme-blossom{ --bg:#2b1420; --bg-2:#3a1b2a; --card:#4a2436; --gold:#e88bab; --gold-soft:#f2b3c8; --cream:#fce8ef; --muted:#c98fa6; --line:rgba(252,232,239,0.15); }
  body.theme-mono{ --bg:#1a1a1a; --bg-2:#232323; --card:#2d2d2d; --gold:#d9d9d9; --gold-soft:#f2f2f2; --cream:#f5f5f5; --muted:#9a9a9a; --line:rgba(245,245,245,0.13); }
  *{box-sizing:border-box;}
  body{margin:0; background:radial-gradient(ellipse at top, var(--bg-2), var(--bg) 70%); color:var(--cream); font-family:'Inter',sans-serif; line-height:1.6; min-height:100vh;}
  .wrap{max-width:560px; margin:0 auto; padding:60px 24px 100px;}
  h1,h2{font-family:'Fraunces',serif; font-weight:600; margin:0 0 10px;}
  h1{font-size:32px;} h2{font-size:22px; color:var(--gold-soft);}
  .eyebrow{font-size:12px; text-transform:uppercase; letter-spacing:2px; color:var(--gold); margin-bottom:10px;}
  p{color:var(--muted); margin:0 0 8px;}
  label{display:block; font-size:13px; color:var(--gold-soft); margin:18px 0 6px; letter-spacing:0.3px;}
  input[type=text], input[type=email], input[type=password], textarea, select{width:100%; background:var(--card); border:1px solid var(--line); color:var(--cream); border-radius:8px; padding:11px 13px; font-family:'Inter'; font-size:14px;}
  .auth-tabs{display:flex; gap:10px; margin-bottom:16px;}
  .auth-tab{padding:8px 16px; border-radius:20px; border:1px solid var(--line); cursor:pointer; font-size:13px; color:var(--muted);}
  .auth-tab.active{border-color:var(--gold); color:var(--gold-soft);}
  .top-bar{display:flex; justify-content:space-between; align-items:center; margin-bottom:24px; font-size:13px; color:var(--muted);}
  .top-bar a{color:var(--gold-soft); cursor:pointer;}
  textarea{resize:vertical; min-height:60px;}
  input:focus, textarea:focus, select:focus{outline:none; border-color:var(--gold);}
  .btn{display:inline-block; margin-top:18px; background:transparent; border:1px solid var(--gold); color:var(--gold-soft); font-family:'Inter'; font-size:14px; padding:11px 24px; border-radius:30px; cursor:pointer;}
  .btn:hover{background:var(--gold); color:var(--bg);}
  .btn-primary{background:var(--gold); color:var(--bg);}
  .btn-row{display:flex; gap:10px; flex-wrap:wrap;}
  .btn-small{margin-top:6px; padding:6px 14px; font-size:12px;}
  .card{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px 18px; margin-top:14px;}
  .row-item{display:flex; gap:8px; align-items:flex-start; margin-bottom:10px;}
  .row-item input, .row-item textarea{flex:1;}
  .remove-x{background:none; border:none; color:var(--muted); cursor:pointer; font-size:18px; padding:6px;}
  .theme-grid{display:flex; gap:10px; flex-wrap:wrap; margin-top:10px;}
  .theme-swatch{width:56px; height:56px; border-radius:12px; cursor:pointer; border:2px solid transparent; display:flex; align-items:center; justify-content:center;}
  .theme-swatch.selected{border-color:var(--gold);}
  .icon-grid{display:grid; grid-template-columns:repeat(8,1fr); gap:8px; margin-top:10px;}
  .icon-opt{background:var(--card); border:1px solid var(--line); border-radius:8px; aspect-ratio:1; display:flex; align-items:center; justify-content:center; font-size:20px; cursor:pointer;}
  .icon-opt.selected{border-color:var(--gold); background:#4a2c56;}
  .hidden{display:none !important;}
  .error-text{color:var(--bad); font-size:13px; margin-top:8px;}
  .success-text{color:var(--good); font-size:13px; margin-top:8px;}
  .photo-preview{width:100%; max-width:220px; border-radius:12px; margin-top:10px; display:block;}
  .code-display{font-family:'Fraunces',serif; font-size:26px; color:var(--gold-soft); letter-spacing:1px; margin:14px 0;}
  .stars{position:fixed; inset:0; z-index:0; pointer-events:none;}
  .star{position:absolute; width:2px; height:2px; background:var(--gold-soft); border-radius:50%; opacity:0.5; animation:twinkle 4s infinite ease-in-out;}
  @keyframes twinkle{0%,100%{opacity:0.15;} 50%{opacity:0.85;}}
  .role-cards{display:flex; gap:14px; margin-top:20px; flex-wrap:wrap;}
  .role-card{flex:1; min-width:200px; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:22px; cursor:pointer; text-align:center;}
  .role-card:hover{border-color:var(--gold);}
  .step-dots{display:flex; gap:6px; margin-bottom:20px;}
  .dot{width:8px; height:8px; border-radius:50%; background:var(--line);}
  .dot.active{background:var(--gold);}
  .timeline{list-style:none; padding:0; margin:20px 0 0; position:relative;}
  .timeline::before{content:''; position:absolute; left:9px; top:6px; bottom:6px; width:1px; background:var(--line);}
  .timeline li{position:relative; padding-left:36px; margin-bottom:28px;}
  .timeline li::before{content:''; position:absolute; left:2px; top:4px; width:16px; height:16px; border-radius:50%; background:var(--card); border:1px solid var(--gold);}
  .timeline .date{font-size:12px; color:var(--gold); text-transform:uppercase; letter-spacing:1px;}
  .timeline .title{font-family:'Fraunces',serif; font-size:18px; margin:4px 0 4px;}
  .cards-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:16px;}
  .flip-card{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:20px; min-height:90px; display:flex; align-items:center; justify-content:center; text-align:center; cursor:pointer; font-family:'Fraunces',serif; color:var(--gold-soft); font-size:15px;}
  .quiz-q{margin-bottom:22px;}
  .quiz-q .qtext{font-family:'Fraunces',serif; font-size:16px; color:var(--cream); margin-bottom:10px;}
  .opts{display:flex; flex-direction:column; gap:8px;}
  .opt{background:var(--card); border:1px solid var(--line); border-radius:8px; padding:11px 14px; cursor:pointer; font-size:14px;}
  .opt.correct{border-color:var(--good); color:var(--cream);}
  .opt.wrong{border-color:var(--bad); color:var(--cream);}
  .memgrid{display:grid; grid-template-columns:repeat(4,1fr); gap:9px; margin-top:16px; max-width:360px;}
  .mem-card{position:relative; aspect-ratio:1; cursor:pointer; perspective:600px;}
  .mem-inner{position:relative; width:100%; height:100%; transition:transform 0.4s; transform-style:preserve-3d;}
  .mem-card.flip .mem-inner{transform:rotateY(180deg);}
  .mem-face{position:absolute; inset:0; border-radius:9px; display:flex; align-items:center; justify-content:center; backface-visibility:hidden; font-size:19px;}
  .mem-front{background:var(--card); border:1px solid var(--line); color:var(--gold);}
  .mem-back{background:#4a2c56; border:1px solid var(--gold); color:var(--gold-soft); transform:rotateY(180deg);}
  .mem-card.matched .mem-back{border-color:var(--good);}
  .mem-stats{display:flex; gap:20px; margin-top:12px; font-size:13px; color:var(--muted);}
  .hero-photo{width:100%; border-radius:16px; margin:16px 0;}
  .note-box{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:30px 24px; text-align:center; margin-top:16px;}
  .note-text{font-family:'Fraunces',serif; font-style:italic; font-size:18px; min-height:60px; display:flex; align-items:center; justify-content:center;}
</style>
</head>

<script>
const SUPABASE_URL = 'https://iqgsajzjrqurogivfqph.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlxZ3NhanpqcnF1cm9naXZmcXBoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwMzMwMjcsImV4cCI6MjEwMTYwOTAyN30.10uQgQRj-JIe33E0nPfeMCM7SiTVnbYM7_2MDlIEtRc';

function applyTheme(t){ document.body.className = 'theme-'+t; }

async function renderHome(){
  applyTheme('midnight');
  const { data:{ session } } = await supa.auth.getSession();
  currentUser = session ? session.user : null;
  app.innerHTML = `
    <div class="eyebrow">A little app for two</div>

      <div class="role-card" id="roleCreate"><h2>${currentUser ? 'Go to my portal' : 'Create one'}</h2><p>${currentUser ? 'Sign back in to edit your portal.' : "I'm making a surprise for my partner."}</p></div>

function renderAuth(mode){
  mode = mode || 'signup';
  applyTheme('midnight');
  app.innerHTML = `
    <div class="eyebrow">Your account</div>
    <h1>${mode==='signup' ? 'Create your portal account' : 'Log back in'}</h1>
    <p>This is just for you, the creator. Your partner never needs an account — just the code and the answer.</p>
    <div class="auth-tabs">
      <div class="auth-tab ${mode==='signup'?'active':''}" id="tabSignup">Sign up</div>
      <div class="auth-tab ${mode==='login'?'active':''}" id="tabLogin">Log in</div>
    </div>
    <label>Email</label>

    <label>Password</label>
    <input type="password" id="aPass" placeholder="At least 6 characters">

  `;
  document.getElementById('aBack').onclick = renderHome;

  applyTheme('midnight');
  app.innerHTML = `<div class="eyebrow">Loading your portal…</div>`;
  const { data, error } = await supa.from('portals').select('*').eq('user_id', currentUser.id).maybeSingle();

      <div class="top-bar"><span>Signed in as ${currentUser.email}</span><a id="logout">Log out</a></div>
      <div class="eyebrow">Your portal</div>
      <h1>${draft.heroName || 'Your portal'}</h1>

      <div class="btn-row"><button class="btn btn-primary" id="editBtn">Edit my portal</button><button class="btn" id="previewBtn">Preview surprise</button></div>

    document.getElementById('editBtn').onclick = ()=>{ currentStep=0; renderCreateStep(); };
    document.getElementById('previewBtn').onclick = ()=> renderSurprise(draft);

  } else {
    app.innerHTML = `<div class="top-bar"><span>Signed in as ${currentUser.email}</span><a id="logout">Log out</a></div>`;

    currentStep = 0;
    renderCreateStep();
  }
}

function stepDots(total, active){
  let html = '<div class="step-dots">';
  for(let i=0;i<total;i++) html += `<div class="dot ${i<=active?'active':''}"></div>`;
  return html+'</div>';
}

function renderCreateStep(){
  const steps = [stepCode, stepStory, stepQuiz, stepIcons, stepThemePick, stepReview];
  steps[currentStep]();
}

function stepCode(){
  app.innerHTML = `
    ${stepDots(6,0)}
    <div class="eyebrow">Step 1 of 6</div>
    <h1>Set your code and question</h1>
    <p>The code is what your partner will enter. The security question should be something only they'd know the answer to.</p>
    <label>Couple code (share this with your partner)</label>
    <input type="text" id="fCode" placeholder="e.g. leo-and-mia" value="${draft.code}">
    <label>Security question</label>
    <input type="text" id="fQ" placeholder="Where was our first date?" value="${draft.securityQ}">
    <label>Security answer</label>
    <input type="text" id="fA" placeholder="Only your partner should know this" value="${draft.securityA}">
    <div id="err" class="error-text"></div>
    <div class="btn-row"><button class="btn btn-primary" id="next">Continue</button><button class="btn" id="back">Back</button></div>
  `;
  document.getElementById('back').onclick = currentUser ? renderDashboard : renderHome;
  document.getElementById('next').onclick = ()=>{
    const code = document.getElementById('fCode').value.trim();
    const q = document.getElementById('fQ').value.trim();
    const a = document.getElementById('fA').value.trim();
    if(!code || !q || !a){ document.getElementById('err').textContent = 'Fill in all three fields to continue.'; return; }
    draft.code = code; draft.securityQ = q; draft.securityA = a;
    currentStep = 1; renderCreateStep();
  };
}

function stepStory(){
  app.innerHTML = `
    ${stepDots(6,1)}
    <div class="eyebrow">Step 2 of 6</div>
    <h1>Tell your story</h1>
    <label>Their name</label>
    <input type="text" id="fName" placeholder="Her name" value="${draft.heroName}">
    <label>A short line for the top of the page</label>
    <input type="text" id="fSub" placeholder="A little corner of the internet that's just ours" value="${draft.heroSubtitle}">
    <label>A photo of you two (optional)</label>
    <input type="file" id="fPhoto" accept="image/*">
    <img id="photoPreview" class="photo-preview ${draft.photoDataUrl?'':'hidden'}" src="${draft.photoDataUrl}">
    <label>Timeline of moments</label>
    <div id="timelineList"></div>
    <button class="btn btn-small" id="addTimeline">Add a moment</button>
    <label>Reasons you love them</label>
    <div id="reasonsList"></div>
    <button class="btn btn-small" id="addReason">Add a reason</button>
    <div class="btn-row" style="margin-top:24px;"><button class="btn btn-primary" id="next">Continue</button><button class="btn" id="back">Back</button></div>
  `;
  document.getElementById('back').onclick = ()=>{ currentStep=0; renderCreateStep(); };
  document.getElementById('fPhoto').onchange = handlePhotoUpload;
  renderTimelineList();
  renderReasonsList();
  document.getElementById('addTimeline').onclick = ()=>{ draft.timeline.push({date:'',title:'',text:''}); renderTimelineList(); };
  document.getElementById('addReason').onclick = ()=>{ draft.reasons.push(''); renderReasonsList(); };
  document.getElementById('next').onclick = ()=>{
    draft.heroName = document.getElementById('fName').value.trim() || 'You';
    draft.heroSubtitle = document.getElementById('fSub').value.trim();
    saveTimelineFromDom(); saveReasonsFromDom();
    currentStep = 2; renderCreateStep();
  };
}

function renderTimelineList(){
  const el = document.getElementById('timelineList');
  el.innerHTML = draft.timeline.map((item,i)=>`
    <div class="card" data-idx="${i}">
      <div class="row-item"><input type="text" class="t-date" placeholder="Day one" value="${item.date}"><input type="text" class="t-title" placeholder="How we met" value="${item.title}"><button class="remove-x" data-remove-timeline="${i}">×</button></div>
      <textarea class="t-text" placeholder="What happened">${item.text}</textarea>
    </div>
  `).join('');
  el.querySelectorAll('[data-remove-timeline]').forEach(b=>{
    b.onclick = ()=>{ saveTimelineFromDom(); draft.timeline.splice(parseInt(b.dataset.removeTimeline),1); renderTimelineList(); };
  });
}
function saveTimelineFromDom(){
  document.querySelectorAll('#timelineList .card').forEach((c,i)=>{
    draft.timeline[i] = { date:c.querySelector('.t-date').value, title:c.querySelector('.t-title').value, text:c.querySelector('.t-text').value };
  });
}
function renderReasonsList(){
  const el = document.getElementById('reasonsList');
  el.innerHTML = draft.reasons.map((r,i)=>`<div class="row-item"><input type="text" class="r-text" placeholder="A reason you love them" value="${r}"><button class="remove-x" data-remove-reason="${i}">×</button></div>`).join('');
  el.querySelectorAll('[data-remove-reason]').forEach(b=>{
    b.onclick = ()=>{ saveReasonsFromDom(); draft.reasons.splice(parseInt(b.dataset.removeReason),1); renderReasonsList(); };
  });
}
function saveReasonsFromDom(){
  document.querySelectorAll('#reasonsList .r-text').forEach((inp,i)=>{ draft.reasons[i] = inp.value; });
}

function handlePhotoUpload(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (ev)=>{
    const img = new Image();
    img.onload = ()=>{
      const maxW = 600;
      const scale = Math.min(1, maxW/img.width);
      const canvas = document.createElement('canvas');
      canvas.width = img.width*scale; canvas.height = img.height*scale;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img,0,0,canvas.width,canvas.height);
      draft.photoDataUrl = canvas.toDataURL('image/jpeg',0.6);
      const preview = document.getElementById('photoPreview');
      preview.src = draft.photoDataUrl;
      preview.classList.remove('hidden');
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

function stepQuiz(){
  app.innerHTML = `
    ${stepDots(6,2)}
    <div class="eyebrow">Step 3 of 6</div>
    <h1>Write a quiz about your story</h1>
    <p>Ask things only someone close to you two would know.</p>
    <div id="quizList"></div>
    <button class="btn btn-small" id="addQ">Add a question</button>
    <div class="btn-row" style="margin-top:24px;"><button class="btn btn-primary" id="next">Continue</button><button class="btn" id="back">Back</button></div>
  `;
  document.getElementById('back').onclick = ()=>{ currentStep=1; renderCreateStep(); };
  renderQuizList();
  document.getElementById('addQ').onclick = ()=>{ draft.quiz.push({q:'',options:['','',''],correct:0}); renderQuizList(); };
  document.getElementById('next').onclick = ()=>{ saveQuizFromDom(); currentStep=3; renderCreateStep(); };
}
function renderQuizList(){
  const el = document.getElementById('quizList');
  el.innerHTML = draft.quiz.map((item,i)=>`
    <div class="card" data-qidx="${i}">
      <div class="row-item"><input type="text" class="q-text" placeholder="Where was our first date?" value="${item.q}"><button class="remove-x" data-remove-q="${i}">×</button></div>
      <label style="margin-top:8px;">Options (mark the correct one)</label>
      ${item.options.map((o,oi)=>`<div class="row-item">
        <select class="q-correct-${i}" data-oi="${oi}" style="width:60px;"><option value="0" ${item.correct==oi?'selected':''}>✓</option><option value="1" ${item.correct!=oi?'selected':''}> </option></select>
        <input type="text" class="q-opt" placeholder="Option ${oi+1}" value="${o}">
      </div>`).join('')}
    </div>
  `).join('');
  el.querySelectorAll('[data-remove-q]').forEach(b=>{
    b.onclick = ()=>{ saveQuizFromDom(); draft.quiz.splice(parseInt(b.dataset.removeQ),1); renderQuizList(); };
  });
  el.querySelectorAll('select').forEach(sel=>{
    sel.onchange = ()=>{
      const card = sel.closest('.card');
      card.querySelectorAll('select').forEach(s=> s.value = (s===sel ? '0':'1'));
    };
  });
}
function saveQuizFromDom(){
  document.querySelectorAll('#quizList .card').forEach((c,i)=>{
    const q = c.querySelector('.q-text').value;
    const opts = Array.from(c.querySelectorAll('.q-opt')).map(o=>o.value);
    const selects = Array.from(c.querySelectorAll('select'));
    let correct = 0;
    selects.forEach((s,si)=>{ if(s.value==='0') correct = si; });
    draft.quiz[i] = { q, options:opts, correct };
  });
}

function stepIcons(){
  app.innerHTML = `
    ${stepDots(6,3)}
    <div class="eyebrow">Step 4 of 6</div>
    <h1>Pick 8 icons for the memory game</h1>
    <div class="icon-grid" id="iconGrid"></div>
    <div id="iconCount" style="margin-top:10px; font-size:13px; color:var(--muted);"></div>
    <div class="btn-row" style="margin-top:24px;"><button class="btn btn-primary" id="next">Continue</button><button class="btn" id="back">Back</button></div>
  `;
  document.getElementById('back').onclick = ()=>{ currentStep=2; renderCreateStep(); };
  const grid = document.getElementById('iconGrid');
  grid.innerHTML = ICON_CHOICES.map(ic=>`<div class="icon-opt ${draft.icons.includes(ic)?'selected':''}" data-icon="${ic}">${ic}</div>`).join('');
  function updateCount(){ document.getElementById('iconCount').textContent = `${draft.icons.length} of 8 selected`; }
  updateCount();
  grid.querySelectorAll('.icon-opt').forEach(opt=>{
    opt.onclick = ()=>{
      const ic = opt.dataset.icon;
      if(draft.icons.includes(ic)){ draft.icons = draft.icons.filter(x=>x!==ic); opt.classList.remove('selected'); }
      else if(draft.icons.length<8){ draft.icons.push(ic); opt.classList.add('selected'); }
      updateCount();
    };
  });
  document.getElementById('next').onclick = ()=>{
    if(draft.icons.length !== 8){ alert('Pick exactly 8 icons.'); return; }
    currentStep = 4; renderCreateStep();
  };
}

function stepThemePick(){
  app.innerHTML = `
    ${stepDots(6,4)}
    <div class="eyebrow">Step 5 of 6</div>
    <h1>Choose a theme</h1>
    <div class="theme-grid" id="themeGrid"></div>
    <div class="btn-row" style="margin-top:24px;"><button class="btn btn-primary" id="next">Continue</button><button class="btn" id="back">Back</button></div>
  `;
  document.getElementById('back').onclick = ()=>{ currentStep=3; renderCreateStep(); };
  const grid = document.getElementById('themeGrid');
  grid.innerHTML = THEMES.map(t=>`<div class="theme-swatch ${draft.theme===t.id?'selected':''}" data-theme="${t.id}" style="background:${t.swatch};" title="${t.label}"></div>`).join('');
  grid.querySelectorAll('.theme-swatch').forEach(sw=>{
    sw.onclick = ()=>{
      draft.theme = sw.dataset.theme;
      grid.querySelectorAll('.theme-swatch').forEach(s=>s.classList.remove('selected'));
      sw.classList.add('selected');
      applyTheme(draft.theme);
    };
  });
  document.getElementById('next').onclick = ()=>{ currentStep=5; renderCreateStep(); };
}

function stepReview(){
  app.innerHTML = `
    ${stepDots(6,5)}
    <div class="eyebrow">Step 6 of 6</div>
    <h1>Ready to save</h1>
    <p>This saves your surprise under the code below. Share the code with your partner separately from the answer — the fun part is they still need the answer to unlock it.</p>
    <div class="code-display">${draft.code}</div>
    <div id="saveMsg"></div>
    <div class="btn-row"><button class="btn btn-primary" id="saveBtn">Save my surprise</button><button class="btn" id="back">Back</button></div>
  `;
  document.getElementById('back').onclick = ()=>{ currentStep=4; renderCreateStep(); };
  document.getElementById('saveBtn').onclick = async ()=>{
    const msg = document.getElementById('saveMsg');
    msg.innerHTML = '<p>Saving…</p>';
    if(!currentUser){ msg.innerHTML = '<div class="error-text">You need to be logged in to save. Go back and sign up.</div>'; return; }
    const { error } = await supa.from('portals').upsert({ user_id: currentUser.id, code: draft.code, data: draft, updated_at: new Date().toISOString() });
    if(error){
      msg.innerHTML = `<div class="error-text">${error.message.includes('duplicate') ? 'That code is taken, pick another.' : 'Something went wrong saving. Try again.'}</div>`;
      return;
    }
    msg.innerHTML = `<div class="success-text">Saved. Send your partner the code "${draft.code}" and let them know the security answer separately.</div>
      <button class="btn" id="goDash">Go to my portal</button>`;
    document.getElementById('goDash').onclick = renderDashboard;
  };
}

function renderUnlock(){
  applyTheme('midnight');
  app.innerHTML = `
    <div class="eyebrow">Unlock a surprise</div>
    <h1>Enter your code</h1>
    <label>Couple code</label>
    <input type="text" id="uCode" placeholder="Enter the code your partner gave you">
    <label id="uQLabel" class="hidden"></label>
    <input type="text" id="uAnswer" class="hidden" placeholder="Your answer">
    <div id="uErr" class="error-text"></div>
    <div class="btn-row"><button class="btn btn-primary" id="uNext">Continue</button><button class="btn" id="uBack">Back</button></div>
  `;
  document.getElementById('uBack').onclick = renderHome;
  let loadedData = null;
  document.getElementById('uNext').onclick = async ()=>{
    const code = document.getElementById('uCode').value.trim();
    const errEl = document.getElementById('uErr');
    if(!code){ errEl.textContent = 'Enter a code first.'; return; }
    if(!loadedData){
      const { data, error } = await supa.from('portals').select('data').eq('code', code).maybeSingle();
      if(error || !data){ errEl.textContent = 'No surprise found for that code.'; return; }
      loadedData = data.data;
      document.getElementById('uQLabel').textContent = loadedData.securityQ;
      document.getElementById('uQLabel').classList.remove('hidden');
      document.getElementById('uAnswer').classList.remove('hidden');
      errEl.textContent = '';
      return;
    }
    const answer = document.getElementById('uAnswer').value.trim().toLowerCase();
    if(answer !== loadedData.securityA.trim().toLowerCase()){
      errEl.textContent = "That's not quite right. Try again.";
      return;
    }
    renderSurprise(loadedData);
  };
}

function renderSurprise(data){
  applyTheme(data.theme);
  app.innerHTML = `
    <div class="eyebrow">For ${data.heroName}</div>
    <h1>${data.heroName} ✎</h1>
    <p>${data.heroSubtitle}</p>
    ${data.photoDataUrl ? `<img class="hero-photo" src="${data.photoDataUrl}">` : ''}

    <h2 style="margin-top:40px;">A few moments</h2>
    <ul class="timeline" id="sTimeline"></ul>

    <h2 style="margin-top:40px;">Reasons, on demand</h2>
    <p>Tap a card. Shuffle for more.</p>
    <div class="cards-grid" id="sCards"></div>
    <button class="btn btn-small" id="sShuffle">Shuffle again</button>

    <h2 style="margin-top:40px;">How well do you know us?</h2>
    <div id="sQuiz"></div>
    <div id="sScore" style="margin-top:10px; font-family:'Fraunces',serif; color:var(--gold-soft);"></div>

    <h2 style="margin-top:40px;">Match the memories</h2>
    <div class="memgrid" id="sMemGrid"></div>
    <div class="mem-stats"><span>Moves: <span id="mMoves">0</span></span><span>Matched: <span id="mMatched">0</span>/8</span></div>
    <div id="mWin" style="margin-top:10px; font-family:'Fraunces',serif; color:var(--gold-soft);"></div>
    <button class="btn btn-small" id="sRestartGame">Restart game</button>
  `;

  const tl = document.getElementById('sTimeline');
  data.timeline.filter(t=>t.title||t.text).forEach(item=>{
    const li = document.createElement('li');
    li.innerHTML = `<div class="date">${item.date}</div><div class="title">${item.title}</div><p>${item.text}</p>`;
    tl.appendChild(li);
  });

  const reasons = data.reasons.filter(r=>r.trim());
  function shuffledReasons(){
    const arr=[...reasons];
    for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; }
    return arr.slice(0,4);
  }
  function renderCards(){
    const c = document.getElementById('sCards'); c.innerHTML='';
    shuffledReasons().forEach(r=>{
      const card=document.createElement('div'); card.className='flip-card'; card.textContent='?';
      card.onclick=()=>{ card.textContent=r; };
      c.appendChild(card);
    });
  }
  renderCards();
  document.getElementById('sShuffle').onclick = renderCards;

  let score=0, answered=0;
  const quizEl = document.getElementById('sQuiz');
  const validQuiz = data.quiz.filter(q=>q.q.trim());
  validQuiz.forEach((item,qi)=>{
    const block=document.createElement('div'); block.className='quiz-q';
    const opts = item.options.map((o,oi)=>`<div class="opt" data-q="${qi}" data-o="${oi}">${o}</div>`).join('');
    block.innerHTML = `<div class="qtext">${item.q}</div><div class="opts">${opts}</div>`;
    quizEl.appendChild(block);
  });
  quizEl.querySelectorAll('.opt').forEach(opt=>{
    opt.onclick = ()=>{
      const qi=opt.dataset.q;
      if(quizEl.querySelectorAll(`.opt[data-q="${qi}"].correct,.opt[data-q="${qi}"].wrong`).length>0) return;
      const oi=parseInt(opt.dataset.o);
      const correctIdx=validQuiz[qi].correct;
      const group=quizEl.querySelectorAll(`.opt[data-q="${qi}"]`);
      group[correctIdx].classList.add('correct');
      if(oi!==correctIdx) opt.classList.add('wrong'); else score++;
      answered++;
      if(answered===validQuiz.length){
        document.getElementById('sScore').textContent = `You got ${score} of ${validQuiz.length}.`;
      }
    };
  });

  let memFlipped=[], memMoves=0, memMatched=0, memLock=false;
  function startMemGame(){
    memFlipped=[]; memMoves=0; memMatched=0; memLock=false;
    document.getElementById('mMoves').textContent='0';
    document.getElementById('mMatched').textContent='0';
    document.getElementById('mWin').textContent='';
    const icons = data.icons.length===8 ? data.icons : ICON_CHOICES.slice(0,8);
    const deck=[...icons,...icons];
    for(let i=deck.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [deck[i],deck[j]]=[deck[j],deck[i]]; }
    const grid=document.getElementById('sMemGrid'); grid.innerHTML='';
    deck.forEach(sym=>{
      const card=document.createElement('div'); card.className='mem-card'; card.dataset.symbol=sym;
      card.innerHTML=`<div class="mem-inner"><div class="mem-face mem-front">?</div><div class="mem-face mem-back">${sym}</div></div>`;
      card.onclick=()=>onMemClick(card);
      grid.appendChild(card);
    });
  }
  function onMemClick(card){
    if(memLock || card.classList.contains('flip') || card.classList.contains('matched')) return;
    card.classList.add('flip'); memFlipped.push(card);
    if(memFlipped.length===2){
      memMoves++; document.getElementById('mMoves').textContent=memMoves;
      memLock=true;
      const [a,b]=memFlipped;
      if(a.dataset.symbol===b.dataset.symbol){
        a.classList.add('matched'); b.classList.add('matched'); memMatched++;
        document.getElementById('mMatched').textContent=memMatched;
        memFlipped=[]; memLock=false;
        if(memMatched===8) document.getElementById('mWin').textContent=`All matched in ${memMoves} moves.`;
      } else {
        setTimeout(()=>{ a.classList.remove('flip'); b.classList.remove('flip'); memFlipped=[]; memLock=false; },700);
      }
    }
  }
  startMemGame();
  document.getElementById('sRestartGame').onclick = startMemGame;
}

renderHome();
</script>
</body>
</html>
